# ============================================================
# application.yml — MOSTLY COMPLETE. Two TODOs marked below.
# ============================================================
# WHAT IT IS:
#   External configuration. Spring Boot reads this at startup and uses it to
#   auto-configure the datasource, JPA, Flyway and the web server.
#
# THE BIG IDEA (12-factor config):
#   Nothing here is hardcoded in Java. In Phase 6 every one of these values
#   becomes an environment variable so the SAME jar runs on your laptop and on
#   AWS with different settings. Notice the ${VAR:default} syntax below — that
#   reads an env var and falls back to the default when it is absent.

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:product_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:pass}

  jpa:
    hibernate:
      # TODO 1: set this to `validate`.
      # Options: none | validate | update | create | create-drop
      # `validate` means: check my entities match the existing schema and refuse
      # to start if they don't. Flyway owns the schema, Hibernate only verifies.
      # Be ready to say why `update` is dangerous in production.
      ddl-auto: validate
    show-sql: true          # prints generated SQL — turn this off in production
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  # TODO 2: pick a port and remember it. 8081 is suggested, because in Phase 2
  # the inventory service will take 8082, payments 8083, and so on.
  port: 8081

logging:
  level:
    org.hibernate.SQL: DEBUG
    # Uncomment the next line to also see the VALUES bound into each query.
    # Extremely useful when a query behaves unexpectedly.
    # org.hibernate.orm.jdbc.bind: TRACE

# ============================================================
# docker-compose.yml — COMPLETE. Nothing to fill in.
# ============================================================
# WHAT IT DOES:
#   Starts a PostgreSQL 16 database for inventory-service ONLY.
#
# HOW TO USE:
#   docker compose up -d      <- start it (run this before your app)
#   docker compose down       <- stop it
#   docker compose down -v    <- stop AND delete all data (fresh start)
#
# WHY A SEPARATE DATABASE (database-per-service):
#   inventory-service owns inventory_db and nobody else may touch it. If
#   order-service wants stock levels, it asks over HTTP. The moment two services
#   share tables, you cannot change one schema without breaking the other, and
#   you have built a distributed monolith.
#
# WHY HOST PORT 5433, NOT 5432:
#   product-postgres already uses 5432 on your machine. Inside the container
#   Postgres still listens on 5432; only the HOST side of the mapping changes.
#   "5433:5432" reads as  host:container.
services:
  postgres:
    image: postgres:16
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432"
    volumes:
      - inventory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  inventory-pgdata:

# ============================================================
# application.yml — COMPLETE. Read it, compare with product-service.
# ============================================================
# WHAT CHANGED VS product-service:
#   - application name, database name, server port (8082)
#   - DB_PORT defaults to 5433, because that is the HOST port in this
#     service's docker-compose.yml (product-postgres already owns 5432).
#
# Same 12-factor idea as before: every value is ${ENV_VAR:default}, so the same
# jar runs locally and in a container with different settings.

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:inventory_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:pass}

  jpa:
    hibernate:
      # Flyway owns the schema, Hibernate only verifies it. Same as Phase 1.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  # product 8081, inventory 8082, payments 8083, ...
  port: 8082

logging:
  level:
    org.hibernate.SQL: DEBUG
    # Turn this on when you test optimistic locking. You will SEE the
    # "... where id=? and version=?" clause and the values bound into it.
    # org.hibernate.orm.jdbc.bind: TRACE
